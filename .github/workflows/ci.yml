name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build + core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # EnableWindowsTargeting lets the whole solution (including WPF) compile on Linux,
      # giving fast signal on XAML/codegen errors before the Windows job finishes.
      - name: Build solution
        run: dotnet build Soundstage.sln -c Release

      - name: Run core tests
        run: dotnet test tests/Soundstage.Core.Tests -c Release --no-build --logger "trx;LogFileName=core-linux.trx"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: "**/TestResults/*.trx"

  windows:
    name: Build + tests + publish (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution
        run: dotnet build Soundstage.sln -c Release

      - name: Run all tests
        run: dotnet test Soundstage.sln -c Release --no-build --logger "trx;LogFileName=windows.trx"

      - name: Publish portable EXE
        run: >
          dotnet publish src/Soundstage.App/Soundstage.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Soundstage-portable-win-x64
          path: publish/

      # Inno Setup 6 is preinstalled on windows-latest runners.
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Soundstage.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Soundstage-Setup
          path: installer/Output/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: "**/TestResults/*.trx"
