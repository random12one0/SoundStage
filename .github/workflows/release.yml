name: Release

# Two ways to cut a release, both build on Windows with the full test suite as
# a gate and publish a GitHub Release with directly downloadable EXEs:
#   1. Push a tag like v0.1.0
#   2. Run this workflow manually (workflow_dispatch) with the version input —
#      the release step then creates the tag itself.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (release gate)
        run: dotnet build Soundstage.sln -c Release

      - name: Publish portable EXE (v1.0 shell)
        run: >
          dotnet publish src/Soundstage.Shell/Soundstage.Shell.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: List publish output (diagnostic)
        shell: pwsh
        run: Get-ChildItem publish -Recurse | Select-Object Name,Length | Format-Table -AutoSize

      - name: Package + create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # Bundle the .exe with the engine DLL (if it wasn't self-extracted into the .exe), so the
          # download always contains everything the app needs to actually process audio.
          $files = @("publish/Soundstage.exe")
          if (Test-Path "publish/soundstage_engine.dll") { $files += "publish/soundstage_engine.dll" }
          Compress-Archive -Path $files -DestinationPath "Soundstage-win-x64.zip" -Force

          $notes = @"
          ## Soundstage $env:VERSION — it processes your audio now

          The first build where Soundstage **actually runs our engine on your live sound**. Turn it on, flip the effect dials, hear them.

          ### One-time setup (~2 minutes)
          Soundstage needs a small free "outlet" to catch your PC's sound so it can process it:
          1. Install **VB-CABLE** (free): https://vb-audio.com/Cable/ — download, run the installer as admin, reboot if it asks.
          2. Open Windows **Sound settings** and set **"CABLE Input"** as your default output (playback) device.
          3. Download **Soundstage-win-x64.zip** below, **unzip it** (right-click -> Extract All), and run **Soundstage.exe** from the extracted folder. (If Windows shows "unknown publisher," click *More info -> Run anyway*. If it asks for the free **WebView2** runtime, that's a Microsoft component already on most Win10/11 PCs.)

          ### Use it
          - Press the **power button** (top-right — "Off" turns to "On"). Your sound now flows: your apps -> CABLE -> Soundstage engine -> your speakers.
          - Tap the effect dials — **Bass, Air, Warmth, Leveler, Ambience, Night** — to turn each on/off and hear the difference.
          - Turn the power **Off** anytime for untouched sound (or switch your Windows output back to your speakers).

          ### What works vs. what's next
          Working: power on/off, the effect toggles, and the whole engine (EQ / bass / leveler / reverb...). Next: **dragging the dials + EQ to fine-tune**, presets, and our own **"Soundstage"** output device so you won't need CABLE.

          This is a first working build — expect rough edges, and tell me what you hit. Requires 64-bit Windows 10/11.
          "@
          gh release create "$env:VERSION" `
            "Soundstage-win-x64.zip#Soundstage-win-x64.zip (unzip, then run Soundstage.exe)" `
            --target "${{ github.sha }}" `
            --title "Soundstage $env:VERSION" `
            --prerelease `
            --notes $notes
