name: Release

# Two ways to cut a release, both build on Windows with the full test suite as
# a gate and publish a GitHub Release with directly downloadable EXEs:
#   1. Push a tag like v0.1.0
#   2. Run this workflow manually (workflow_dispatch) with the version input —
#      the release step then creates the tag itself.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build + publish release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (release gate)
        run: dotnet build Soundstage.sln -c Release

      - name: Publish portable EXE (v1.0 shell)
        run: >
          dotnet publish src/Soundstage.Shell/Soundstage.Shell.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $notes = @"
          ## Soundstage $env:VERSION — v1.0 preview (new app, new UI)

          The first build of the completely rebuilt Soundstage v1.0: **our own audio engine, our own UI, nothing carried over** from the old Equalizer-APO version.

          ### What this preview is
          The real app **UI running natively** — so you can open it on your PC and click through the actual design (dashboard, EQ, speakers, ambience, automations, settings).

          ### What it does NOT do yet
          **Process audio.** The DSP engine (our own reverb, EQ, compressor, bass, stereo width, surround upmix — all built and tested) and the **virtual audio driver** that routes your system sound through it are wired in over the next builds. This one is look-and-feel, running for real.

          ### Run it
          Download **Soundstage.exe** below and run it — no install needed. If Windows prompts for the **WebView2 runtime**, it's a free Microsoft component already on most Windows 10/11 machines. Requires 64-bit Windows 10/11.
          "@
          gh release create "$env:VERSION" `
            "publish/Soundstage.exe#Soundstage.exe (portable, no install needed)" `
            --target "${{ github.sha }}" `
            --title "Soundstage $env:VERSION" `
            --prerelease `
            --notes $notes
